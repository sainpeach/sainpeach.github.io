
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>欢迎来到我的网站</h1>
        <p class="subtitle">这是我从零开始创建的第一个网页。</p>

		<section class="card">
			<h2>Click Counter</h2>
			<p id="countText">
				You have clicked 0 times.
			</p>
			
			<button id="countButton">
				Click Me!
			</button>
			
			<button id="countDec">
				Decrease
			</button>
			
			<button id="countReset">
				Reset
			</button>
		</section>

        <section class="card">
            <h2>关于这个网站</h2>
            <p>我正在学习 HTML、CSS 和 JavaScript。</p>
        </section>

        <section class="card">
            <h2>我的学习目标</h2>
            <ul>
                <li>学会 HTML</li>
                <li>学会 CSS</li>
                <li>学会 JavaScript</li>
                <li>把网站发布到互联网</li>
            </ul>
        </section>
    </main>
</body>
</html>
